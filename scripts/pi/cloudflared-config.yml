# cloudflared config for the Pi — installed by scripts/pi/setup.sh as
# /etc/cloudflared/config.yml with the tunnel id filled in.
#
# One tunnel, one public hostname. The Worker (worker/index.mjs) is the
# only legitimate caller of pi.lannacare.org — a WAF rule on that hostname
# rejects requests without the shared x-origin-key header — and it wants
# the app to believe it is lannacareforanimals.org (the live site), so cloudflared rewrites the Host
# header on the way in (redirects, cookies and getSiteOrigin() then match
# the address the visitor is on).
#
# A second Pi later: run cloudflared there with this same tunnel's
# credentials and Cloudflare balances between the two connectors and drops
# whichever stops answering. No other change.
tunnel: __TUNNEL_ID__
credentials-file: /etc/cloudflared/__TUNNEL_ID__.json

ingress:
  - hostname: pi.lannacare.org
    service: http://127.0.0.1:3000
    originRequest:
      httpHostHeader: lannacareforanimals.org
      connectTimeout: 10s
      noHappyEyeballs: true
  # Test on the same Pi: lanna-care-test.service on 3001, run from its own clone
  # (~/Animal_Shelter_App_test, scripts/pi/setup-test.sh). Reached by the test
  # Worker (ORIGIN_HOST) behind the same WAF rule as pi.lannacare.org.
  - hostname: test-pi.lannacare.org
    service: http://127.0.0.1:3001
    originRequest:
      httpHostHeader: test.lannacare.org
  # UAT on the same Pi (customer acceptance testing, uat.lannacare.org since 2026-11-08): lanna-care-uat.service on 3002,
  # run from its own clone (~/Animal_Shelter_App_uat, scripts/pi/setup-uat.sh). Reached by the UAT
  # Worker (ORIGIN_HOST) behind the same WAF rule. Before this, UAT had no Pi and rendered every
  # page inside the Worker, over the free plan's 10 ms CPU limit (627 errors on 2026-11-05).
  - hostname: uat-pi.lannacare.org
    service: http://127.0.0.1:3002
    originRequest:
      httpHostHeader: uat.lannacare.org
  - service: http_status:404
