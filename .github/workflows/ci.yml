# The merge train's safety net: every PR (and main itself) must type-check,
# lint and build before it is merged, so a feature that was fine on its own
# branch is caught if it breaks against what other workstreams landed.
# See CLAUDE.md "Workstreams".
#
# `next build` needs Supabase env vars to exist at build time (the clients
# read them with `!`), but nothing is fetched during the build, so
# placeholders are enough. No secrets are involved.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  # No merge without a signed-off test checklist (CLAUDE.md, "Testing").
  # Deliberately has no exemption: a small change is not excused from the
  # checklist, it just fills it out fast, because most lines are honestly n/a.
  test-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Red means the plan is missing, incomplete or self-contradictory — always
      # someone's mistake to fix. It does NOT go red merely because nobody has
      # signed the manual line yet: that is the normal state for most of a PR's
      # life, and check-test-plan.mjs exits 0 for it while still printing what is
      # outstanding (2026-09-24). This job used to carry `continue-on-error: true`
      # for exactly that reason — with several sessions pushing, a correct-but-
      # unsigned plan failed the workflow every couple of minutes, and a red
      # people are emailed about hourly is one they filter. Suppressing the job
      # fixed the noise and lost the signal: a genuinely broken plan also went
      # green. Moving the distinction into the script gets both.
      #
      # Still not a required check in branch protection — that is the user's
      # staged rollout (CLAUDE.md, "Testing"), and a red here does not block a
      # merge. The release manager's pre-deploy pass is what catches a PR that
      # reached main unchecked.
      - run: node scripts/check-test-plan.mjs --base origin/${{ github.base_ref }}

  # A new supabase/migrations/ file must be numbered one past the highest on
  # main, with no number used twice (CLAUDE.md, "Database migrations"). The
  # same script is .githooks/pre-commit; here it runs on the PR's merge commit
  # against a freshly fetched base, which the hook deliberately never fetches.
  # Pull requests only: on main itself every file is main's, so there is
  # nothing new to judge.
  migration-numbers:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-migration-numbers.mjs --base origin/${{ github.base_ref }}
