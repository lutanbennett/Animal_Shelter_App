# The merge train's safety net: every PR (and main itself) must type-check,
# lint and build before it is merged, so a feature that was fine on its own
# branch is caught if it breaks against what other workstreams landed.
# See CLAUDE.md "Workstreams".
#
# `next build` needs Supabase env vars to exist at build time (the clients
# read them with `!`), but nothing is fetched during the build, so
# placeholders are enough. No secrets are involved.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Asked once, so the heavy jobs below can skip a documents-only pull request.
  # A markdown file under docs/, or one at the repository root, is read by no
  # build, lint, test or database check — nothing in src/, scripts/ or worker/
  # imports one. `test-plan` is deliberately NOT gated on this: a documents PR
  # still carries a checklist, and that is the one check that judges a document.
  #
  # Added after 0.38.0, where the record PR — two markdown files — paid ~7
  # minutes of CI and was then blocked TWICE by `public-views`, a check it could
  # not affect: once by a three-minute race (a view live in shared dev before the
  # branch proving who owned it was pushed) and once by a stale allow-list after
  # that branch merged. docs/decisions/2026-10-20-release-paperwork-speedup.md
  #
  # It runs on `push` as well as `pull_request` so that `needs: changes` resolves
  # on main, where it always answers `false` — a skipped dependency would
  # otherwise skip the job that needs it, and main's CI would quietly stop.
  # check-docs-only.mjs errs towards `false` for anything it cannot classify.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
      deps-changed: ${{ steps.classify.outputs.deps-changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: classify
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check-docs-only.mjs --base origin/${{ github.base_ref }}
          else
            node scripts/check-docs-only.mjs
          fi

  check:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      # The pure modules' assertions (node --test; scripts/test-support/).
      - run: npm test
      - run: npm run build

  # No merge without a signed-off test checklist (CLAUDE.md, "Testing").
  # Deliberately has no exemption: a small change is not excused from the
  # checklist, it just fills it out fast, because most lines are honestly n/a.
  test-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Red means the plan is missing, incomplete or self-contradictory — always
      # someone's mistake to fix. It does NOT go red merely because nobody has
      # signed the manual line yet: that is the normal state for most of a PR's
      # life, and check-test-plan.mjs exits 0 for it while still printing what is
      # outstanding (2026-09-24). This job used to carry `continue-on-error: true`
      # for exactly that reason — with several sessions pushing, a correct-but-
      # unsigned plan failed the workflow every couple of minutes, and a red
      # people are emailed about hourly is one they filter. Suppressing the job
      # fixed the noise and lost the signal: a genuinely broken plan also went
      # green. Moving the distinction into the script gets both.
      #
      # Still not a required check in branch protection — that is the user's
      # staged rollout (CLAUDE.md, "Testing"), and a red here does not block a
      # merge. The release manager's pre-deploy pass is what catches a PR that
      # reached main unchecked.
      - run: node scripts/check-test-plan.mjs --base origin/${{ github.base_ref }}

  # A new supabase/migrations/ file must be numbered one past the highest on
  # main, with no number used twice (CLAUDE.md, "Database migrations"). The
  # same script is .githooks/pre-commit; here it runs on the PR's merge commit
  # against a freshly fetched base, which the hook deliberately never fetches.
  # Pull requests only: on main itself every file is main's, so there is
  # nothing new to judge.
  migration-numbers:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # GH_TOKEN lets the open-PR half ask `gh pr list`; without it that half warns and skips, the filename half still runs.
      - run: node scripts/check-migration-numbers.mjs --base origin/${{ github.base_ref }}
        env:
          GH_TOKEN: ${{ github.token }}

  # A `_th` column a migration adds must be registered in translatable_labels (or named as deliberate in the script), or
  # no manager can translate it from Management -> Translations. Blocking: it reads only the migration files, so it
  # cannot fail for a reason outside the pull request. See docs/decisions/2026-11-02-translations-unlisted-ci-gate.md.
  translations-unlisted:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-translations-unlisted.mjs

  # A migration added on this branch must not create a policy that names a role
  # (current_user_role() or an app_role literal): policies ask what you may do,
  # not who you are. Static, reads only the added SQL files, so it needs no
  # Supabase token (the DB-backed check-policy-role-names.mjs would; see
  # docs/decisions/2026-10-07-policy-enum-guard.md). A deliberate one carries
  # "-- policy-role: deliberate — <why>". Pull requests only, like migration-numbers.
  new-policy-role-names:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-new-policy-role-names.mjs --base origin/${{ github.base_ref }}

  # scripts/ is loaded by nothing CI runs: typecheck, lint and build never
  # touch it, so a syntax error in deploy.mjs reached main with CI green
  # (#302), and spare-clone.sh was committed 100644 while its systemd unit runs
  # it directly. This parses every scripts/**/*.mjs and checks the index mode of
  # each *.sh named in a .service ExecStart (check-script-integrity.mjs, which
  # prints what it does not cover). Pull requests and main alike, because it
  # judges the tree rather than a diff.
  script-integrity:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-script-integrity.mjs
      # The Worker and the Pi must build with the same Server Actions key, or a
      # form rendered by one fails on the other (check-actions-key.mjs).
      - run: node scripts/check-actions-key.mjs
      # Every backlog item keeps a permanent id. Without one its page anchor comes
      # from its title, so the next grooming round that rewords that title detaches
      # Lutan's Customer priority from it — weeks-later damage from a commit that
      # looked fine. `node scripts/backlog-ids.mjs docs/backlog.md` fixes it.
      - run: node scripts/check-backlog-ids.mjs
      # Public hostnames (site-hosts.ts) and public pages (public-paths.ts) are each one list.
      - run: node scripts/check-site-hosts.mjs
      - run: node scripts/check-public-paths.mjs
      # Every table with an audit trigger is listed in Recent changes with a name and a label in both dictionaries,
      # and no listed table is gone. Reads the migrations and the source: no database, no node_modules.
      - run: node scripts/check-audited-tables.mjs
      # A database refusal a person reads is a KEY the app words in Thai or English, not an English sentence (#3nuwy).
      # Fails on a person-read function defined from 0339 that raises a sentence, and on a raised key with no wording
      # in en.ts or th.ts. Ignores older functions until they are next redefined. Reads migrations and source only.
      - run: node scripts/check-sql-refusal-keys.mjs
      # A permission prop is never JSX shorthand: a bare `canManage` is always true,
      # which is how #1126's Settings → Website hole was written.
      - run: node scripts/check-permission-props.mjs
      # No Thai entry is its English copied across (a missing key already fails the
      # typecheck; a wrong one did not). Imports both dictionaries, so templated and
      # multi-line entries are compared too. Its second rule — English typed into a
      # .tsx instead of the dictionary — REPORTS ONLY and carries no stored count;
      # docs/decisions/2026-10-31-thai-dictionary-check.md says when that flips.
      # Rule 3 of the next check parses .ts files with the TypeScript compiler, so this job needs node_modules.
      # Installed here, after the checks that need nothing, so a failed install cannot hide them.
      - run: npm ci --ignore-scripts
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-thai-dictionary.mjs
      # deploy-pi.sh must run the script it just checked out, not the copy bash had open.
      - run: node scripts/pi/check-self-update.mjs

  # The twenty-one cards: cards.ts has exactly the agreed set and every card names
  # a real activity. The code half of check-card-grants.mjs, which needs the dev
  # token and so cannot run here (check-cards-count.mjs reads only cards.ts and
  # catalogue.ts). Fails honestly — no continue-on-error. "Advisory" means only
  # that it is not a required check in branch protection, which is Lutan's call
  # (docs/decisions/2026-10-16-cards-count-in-ci.md). Judges the tree, so PRs and main.
  cards-count:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-cards-count.mjs

  # Is any activity granted by NO card? Resolved through bundleOfCards, as the app does (docs/decisions/2026-11-06-card-grant-checks.md).
  # Blocking: the two Admin-only rulings and the 17 first-run gaps are named records in docs/ungranted-activities-allowlist.json,
  # so it is green on main and goes red only on a NEW gap (or a record gone stale). Reads files only.
  ungranted-activities:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-ungranted-activities.mjs

  # A decision file this PR ADDS must not be dated after today. Needs history for the merge-base. Runs on docs-only PRs too: decisions are docs.
  decision-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-decision-dates.mjs origin/main

  # Hard-coded security is forbidden (CLAUDE.md). Asserts ZERO coded security outside the Admin bypass (no baselines): fails on an
  # unrecorded role read, service-role file, env var, or new migration policy/definer function outside a card; the survivors are named records in
  # docs/hard-coded-security-registry.json. No continue-on-error: a red that cannot fail gets ignored. Reads files, not the live database.
  # Judges the tree, so PRs and main (docs/decisions/2026-10-25-no-coded-security-inventory.md).
  hard-coded-security:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-hard-coded-security.mjs

  # A link must ask the activity its DESTINATION asks (backlog #79sqf, sweeps 6-11): a login that holds the page's card but not the
  # destination's is offered a link that ends at /no-access. Static (TypeScript AST), a few seconds, cards only. Blocks on any finding not in
  # docs/destination-activity-allowlist.json; unresolved links are printed, never passed silently (docs/decisions/2026-11-09-destination-activity-check.md).
  destination-activity:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/check-destination-activity.mjs

  # A control must ask the activity its own ACTION asks (backlog #79sqf, the second resolver): control -> server action / rpc (live SQL) -> the
  # card it asks, against the gate the control sits under. Static, ~20 s, cards only. Blocks on any finding not in docs/control-activity-allowlist.json;
  # unresolved controls are printed, never passed silently (docs/decisions/2026-11-11-control-activity-check.md).
  control-activity:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/check-control-activity.mjs

  # THE WHOLE-PAGE RULE for the Pi failover replay list: does every write reachable at each path on
  # WRAPPED_WRITE_PATHS go through runWriteAction()? A listed path with one unwrapped write is the #250 double
  # write — the Worker's rule is method plus path (worker/origin.mjs mayReplayWrite), so it replays the write
  # without a claim and the save lands twice.
  #
  # It BLOCKS, and it is the check that would have caught /admin/units being listed with the shared header's
  # twelve unwrapped writes reachable at it. It could not be wired in when it was written (#1149) because it
  # correctly reported that breach, so it would have failed every build; the header stream closed the breach
  # and switched it on (docs/decisions/2026-11-01-header-writes-wrapped.md). Reads only the repo, like
  # cards-count. Nothing here is advisory: fail closed, take the path off the list, or wrap the write.
  wrapped-write-paths:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-wrapped-write-paths.mjs

  # The card walkthrough (docs/card-walkthrough.md) is generated from cards.ts: fails when a card has no steps or the
  # file is out of date. Reads only the repo, like cards-count (docs/decisions/2026-10-22-card-walkthrough-generated.md).
  card-walkthrough:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-card-walkthrough.mjs

  # Known-vulnerable production dependencies, reported, not enforced. Red on
  # this job would learn to be ignored: npm audit routinely reports things
  # nobody can act on today (an advisory with no fixed release, a chain that
  # only a major bump clears), and a check that is red for a week before
  # anyone can do anything is one people stop reading. So `continue-on-error`
  # is right HERE — the opposite of test-plan above, where the same flag hid a
  # genuinely broken plan behind green. The difference: test-plan's failures
  # are always someone's mistake to fix, this one's are not. Read the log on
  # the PR; act on a high or critical with a fix available. A daily run in
  # advisories.yml covers the days with no PR, and fails on purpose.
  #
  # Scoped 2026-10-25 (docs/decisions/2026-10-25-audit-on-releases-not-every-pr.md): it runs only on a PR that
  # changes package.json or package-lock.json, because a PR that touches no dependency cannot change what the audit
  # says, and a check that is red on most PRs and ignored is not adding value. The advisory check that someone acts
  # on is the release step (docs/release-procedure.md, "Audit the production dependencies"), with the daily run
  # between. A PR that skips this job shows it as SKIPPED, which is not a pass that checked something. The timeout,
  # the retry and continue-on-error below are exactly as before. Do not "tidy" advisories.yml to match.
  audit:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.deps-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # npm audit has no timeout of its own and has hung on the registry for
      # the whole job (PR #836: killed after 5 min, no output at all). So: 90 s
      # a try, one retry, and "could not reach the registry" is a warning, not
      # a red. Red is reserved for an actual finding, which still fails the
      # step; continue-on-error above still stops it blocking a merge.
      - name: npm audit (production dependencies)
        run: |
          for attempt in 1 2; do
            set +e
            timeout 90 npm run audit:register 2>&1 | tee audit.log
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" -eq 0 ]; then exit 0; fi
            # A finding: npm printed its summary. Fail, and do not retry.
            if grep -qE "^found [0-9]+ vulnerabilit|vulnerabilities$|Severity:" audit.log; then exit "$code"; fi
            echo "attempt $attempt inconclusive (exit $code, no advisory output)"
          done
          echo "::warning title=npm audit inconclusive::Could not reach the registry; no advisory was read. This is not a finding."
          exit 0

  # The public tier of the test database must read the public_* views and
  # nothing else: no write through them, no other table, view or function
  # answering anon (check-public-views.mjs; backlog DB-10). Until now it was
  # run by hand before a go-live. It needs the test project's URL, anon key
  # and service-role key as repository secrets (TEST_SUPABASE_URL,
  # TEST_SUPABASE_ANON_KEY, TEST_SUPABASE_SERVICE_ROLE_KEY); a pull request
  # from a fork gets none, and the job says so rather than passing for
  # having checked nothing. The test database is what the merged migrations
  # are applied to first (CLAUDE.md, "Database migrations"), so a PR's own
  # migration is already there when this runs.
  public-views:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      # Full history so every origin/* branch is present: a public view created
      # by another unmerged branch is told apart from an unlisted one of ours by
      # reading that branch's migrations (scripts/lib/public-view-owner.mjs).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the public tier
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning title=public-views not run::TEST_SUPABASE_URL, TEST_SUPABASE_ANON_KEY and TEST_SUPABASE_SERVICE_ROLE_KEY are not available to this run, so the public tier was not checked."
            exit 0
          fi
          node scripts/check-public-views.mjs
