# Nightly shared-tables check against the DEV and PRODUCTION projects (backlog #shtci; docs/decisions/2026-11-17-shared-tables-check-scheduled.md).
#
# Proves every public table with no shelter_id is recorded, with a reason, in docs/tenancy-shared-tables-registry.json,
# and that no record is stale. A new tenant table added without shelter_id is invisible to the canary (these tables are
# readable by design), so this is the only instrument that notices it. It reads pg_catalog through the Management API,
# so it uses a repository secret per environment: SUPABASE_ACCESS_TOKEN (dev) and SUPABASE_ACCESS_TOKEN_PROD
# (production), each scoped to its own project with Database: Read and nothing else.
#
# TWO JOBS, ONE PER ENVIRONMENT, ON PURPOSE: a red run then says WHICH database grew an unrecorded table, which one
# job could not. Production's token was created 2026-11-17, closing the half #shtci was left open for.
#
# WHY NEITHER JOB PASSES --env: scripts/lib/env.mjs loads .env.deploy.<env> for any environment but "test", and
# EXITS 2 when that file is missing. It is gitignored and exists only on the developer's PC, so --env production
# would stop here before reaching the database. Without the flag the script takes NEXT_PUBLIC_SUPABASE_URL and
# SUPABASE_ACCESS_TOKEN straight from the environment below, and projectRef() resolves the project from that URL.
# The production address is not a secret and is already committed in wrangler.jsonc's production env.
#
# Scheduled, not per PR, and allowed to FAIL: a scheduled run has no PR to stand on, so a failure cannot turn any PR red.
# WHERE A FAILURE GOES: GitHub emails whoever last edited the cron line below, and shows a red run in the Actions tab.
# That is the whole mechanism; nothing else alerts anybody. Whoever edits the cron line owns that email.
#
# Separate from tenancy-catalogue.yml because the two fail for unrelated reasons and one job would hide which went red.
# 07:31 UTC chosen to collide with neither tenancy-catalogue.yml (05:43) nor advisories.yml (06:17).

name: Tenancy shared tables

on:
  schedule:
    - cron: "31 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  shared-tables:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-tenancy-shared-tables.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}

  shared-tables-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-tenancy-shared-tables.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_PROD }}
          # Already committed in wrangler.jsonc's production env; not a secret.
          NEXT_PUBLIC_SUPABASE_URL: https://dbkodyyxxhtygxcxmfcu.supabase.co

  # Backlog #ccwnx; docs/decisions/2026-11-18-card-catalogue-not-writable.md. Proves no login can write the shared card
  # catalogue (card_grants, card_includes): no permissive insert/update/delete/all policy, row security on, no write privilege
  # for anon/authenticated. 0407 removed that access; check-hard-coded-security.mjs would PASS a re-added `for all using
  # (is_admin())` policy and the canary diffs reads, not writes, so this is the only guard on the regression.
  # Its own jobs (not steps of the two above) so a red one says which check failed. It lives in this workflow so it is not a
  # fifth mechanism; the cron line above is its cron line, so whoever edits it gets the failure email (see header).
  # Dev AND production: 0407 reached production in 0.47.2 (2026-11-18), so a production run is truthful, not red for a known reason.
  card-catalogue-writes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-card-catalogue-writes.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}

  card-catalogue-writes-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-card-catalogue-writes.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_PROD }}
          # Already committed in wrangler.jsonc's production env; not a secret.
          NEXT_PUBLIC_SUPABASE_URL: https://dbkodyyxxhtygxcxmfcu.supabase.co
